name: RawsamPrinter
options:
  bundleIdPrefix: com.husainalkhazraji
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  RawsamPrinter:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - LineArt.mlpackage
          - LineArt.mlpackage/**
      - path: App/LineArt.mlpackage
        type: file
        buildPhase: sources
    settings:
      base:
        PRODUCT_NAME: RawsamPrinter
        PRODUCT_BUNDLE_IDENTIFIER: com.husainalkhazraji.rawsamprinter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
